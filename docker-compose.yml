name: fjordhub

services:
  traefik:
    image: traefik:v3.3
    container_name: fjordhub-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=fjord-net"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=false"
      - "--api.insecure=false"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fjord-net
    restart: unless-stopped

  fjordhub:
    image: ${FJORDHUB_IMAGE:-fjordhub-fjordhub:latest}
    build: .
    container_name: fjordhub
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8091}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev:/host/dev:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - /proc:/host/proc:ro
      - "${DATA_DIR:-./data}:/data"
      - "${APPS_DIR:-./apps}:/apps"
      - "${FJORDHUB_HOST_DIR:-.}:/fjordhub-src"
      - fjordhub-control-secrets:/run/fjordhub-control
      - fjordcode-token:/run/fjordcode-token
    environment:
      DATA_DIR: /data
      NVIDIA_DEVICE_ROOT: /host/dev
      HOST_CGROUP_ROOT: /host/sys/fs/cgroup
      HOST_PROC_ROOT: /host/proc
      FJORDHUB_MEMORY_RECONCILE: "1"
      PROXMOX_API_URL: ${PROXMOX_API_URL:-}
      FJORDHUB_STORAGE_SSH_HOST: ${FJORDHUB_STORAGE_SSH_HOST:-}
      PROXMOX_NODE: ${PROXMOX_NODE:-pve}
      PROXMOX_VMID: ${PROXMOX_VMID:-1000}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      PROXMOX_VERIFY_SSL: ${PROXMOX_VERIFY_SSL:-false}
      APP_PORT: ${APP_PORT:-8091}
      TZ: ${TZ:-Europe/Copenhagen}
      SECRET_KEY: ${SECRET_KEY:-}
      FJORDHUB_PUBLIC_URL: ${FJORDHUB_PUBLIC_URL:-}
      FJORDHUB_TRUSTED_PROXIES: ${FJORDHUB_TRUSTED_PROXIES:-}
      FJORDHUB_UPDATER_TOKEN_FILE: /run/fjordhub-control/updater_token
      # URL to registry.json in FjordHub's GitHub repo (raw content URL)
      REGISTRY_URL: ${REGISTRY_URL:-https://raw.githubusercontent.com/qlerup/fjordhub/main/registry.json}
      FJORDHUB_UPDATER_URL: http://fjordhub-updater:8090
      FJORDHUB_IMAGE: ${FJORDHUB_IMAGE:-fjordhub-fjordhub:latest}
      APPS_DIR: /apps
      FJORDHUB_SRC_DIR: /fjordhub-src
      # Paths to each app's docker-compose directory on the host
      FJORDLENS_DIR: ${FJORDLENS_DIR:-}
      FJORD3D_DIR: ${FJORD3D_DIR:-${FJORDSHARE_DIR:-}}
      FJORDSHARE_DIR: ${FJORDSHARE_DIR:-}
      FJORDPARCEL_DIR: ${FJORDPARCEL_DIR:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=fjord-net"
      - "traefik.http.routers.fjordhub.rule=PathPrefix(`/`)"
      - "traefik.http.routers.fjordhub.priority=1"
      - "traefik.http.services.fjordhub.loadbalancer.server.port=8080"
    networks:
      - fjord-net
      - fjord-control
      - fjord-code
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Isolated Codex execution runtime. No host filesystem or Docker socket access.
  fjordcode:
    profiles: [codex]
    build:
      context: .
      dockerfile: fjordcode_worker/Dockerfile
    container_name: fjordhub-code
    user: "10001:10001"
    environment:
      HOME: /home/codex
      CODEX_HOME: /home/codex/.codex
    volumes:
      - fjordcode-workspaces:/workspaces
      - fjordcode-home:/home/codex
      - fjordcode-token:/run/fjordcode-token:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 3g
    networks:
      - fjord-code
    restart: unless-stopped

  fjordhub-updater:
    build:
      context: .
      dockerfile: updater_service/Dockerfile
    container_name: fjordhub-updater
    working_dir: /repo
    environment:
      APP_DIR: /repo
      SERVICE_NAME: fjordhub
      UPDATER_SERVICE_NAME: fjordhub-updater
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-fjordhub}
      COMPOSE_SERVICES: "fjordhub"
      DATA_DIR: ${DATA_DIR:-./data}
      APPS_DIR: ${APPS_DIR:-./apps}
      FJORDHUB_HOST_DIR: ${FJORDHUB_HOST_DIR:-.}
      FJORDHUB_UPDATER_STATE_DIR: /state
      FJORDHUB_UPDATER_TOKEN_FILE: /run/fjordhub-control/updater_token
      TZ: ${TZ:-Europe/Copenhagen}
    volumes:
      - "${FJORDHUB_HOST_DIR:-.}:/repo"
      - "${DATA_DIR:-./data}/fjordhub-updater:/state"
      - /var/run/docker.sock:/var/run/docker.sock
      - fjordhub-control-secrets:/run/fjordhub-control
    networks:
      - fjord-control
    restart: unless-stopped

networks:
  # Dedicated control network. Not internal: updater needs outbound Git access.
  fjord-control:
    driver: bridge
  fjord-net:
    name: fjord-net
    driver: bridge
  fjord-code:
    driver: bridge
    internal: false  # GitHub/OpenAI access for cloning and Codex authentication

volumes:
  fjordhub-control-secrets:
  fjordcode-token:
  fjordcode-workspaces:
  fjordcode-home:
